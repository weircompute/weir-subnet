[project]
name = "weir-subnet"
version = "0.1.0"
description = "Weir GPU subnet: miner node agent"
requires-python = ">=3.10"
dependencies = [
    "bittensor==11.3.0",
    "aiohttp>=3.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = ["torch>=2.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
weir-node = "weir_subnet.cli:node_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["weir_subnet*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
